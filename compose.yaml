x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: booking-salon-php
  volumes:
    - .:/var/www/html
  environment:
    COMPOSER_HOME: /tmp/composer
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --backoff=10
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  # Bot Telegram trên máy dev (không có URL public cho webhook): docker compose --profile telegram up -d
  telegram:
    <<: *app
    command: php artisan telegram:poll
    restart: unless-stopped
    profiles: [telegram]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  mysql-data:
